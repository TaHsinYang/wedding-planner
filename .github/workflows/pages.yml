name: Verify and deploy wedding planner
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify synchronization logic and JavaScript
        run: |
          npm test
          npm run check
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static website
        run: |
          mkdir _site
          cp index.html app.js ui.js sync.js config.js .nojekyll _site/
          cp -R vendor _site/
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
