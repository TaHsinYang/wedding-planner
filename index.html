<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f4ee"><title>Our Wedding Planner 💍</title><style>
:root{--bg:#f8f4ee;--paper:#fffdf9;--ink:#554940;--muted:#97877b;--accent:#b78c78;--line:#eadfd5;--green:#8c9d87}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;font-size:15px}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:720px;margin:auto;padding:20px 17px 105px}.eyebrow{letter-spacing:3px;font-size:11px;color:var(--accent);font-weight:700;text-align:center}.hero{text-align:center;padding:20px 8px 24px}.hero h1{font-family:Georgia,serif;font-weight:400;font-size:35px;margin:12px 0}.hero p{color:var(--muted);font-size:13px}.datebox{margin:20px auto 0;background:#f0e7df;border-radius:22px;padding:18px;max-width:420px}.days{font:40px Georgia,serif;color:#a87b68}.datebox input{background:transparent;border:0;color:var(--ink);text-align:center}.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 15px;position:sticky;top:0;background:var(--bg);z-index:3}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:25px;padding:11px 16px}.tab.active{background:var(--accent);color:white;border-color:var(--accent)}.panel{display:none}.panel.active{display:block}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:13px;box-shadow:0 4px 15px #8c6c5510}.card h2{font-size:17px;margin:0 0 12px}.hint{font-size:12px;color:var(--muted);line-height:1.6}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f3ebe4;border-radius:14px;padding:15px}.stat b{display:block;font-size:23px;margin:5px 0}.progress{height:9px;background:#eae1d9;border-radius:10px;overflow:hidden}.progress span{display:block;background:var(--green);height:100%;transition:width .2s}.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee5dc}.item:last-child{border-bottom:0}.item .main{flex:1;min-width:0}.item input[type=checkbox]{width:20px;height:20px;accent-color:var(--green)}.done{text-decoration:line-through;color:#a9a099}.small{font-size:12px;color:var(--muted)}.pill{border-radius:20px;background:#f2e8e0;padding:4px 9px;font-size:11px;color:#98735f}.btn{border:0;background:var(--accent);color:white;border-radius:13px;padding:12px 16px;font-weight:600}.btn.secondary{background:#eee5dd;color:var(--ink)}.btn.danger{background:#f7e5e1;color:#a95e56}.iconbtn{border:0;background:transparent;color:#b8a69a;font-size:19px;padding:7px}.form{display:grid;gap:10px}.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:white;color:var(--ink);outline-color:var(--accent)}.form textarea{min-height:95px;resize:vertical}.form label{font-size:12px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0}.empty{text-align:center;color:var(--muted);padding:25px}.money{font-weight:700;font-size:16px}.footer{text-align:center;font-size:11px;color:#a99a8e;padding:20px}.backup{display:flex;gap:8px;flex-wrap:wrap}.backup button{flex:1}.note{white-space:pre-wrap;overflow-wrap:anywhere}.section-title{font-size:14px;color:#9c7968;letter-spacing:1px;margin:16px 2px 8px}@media(min-width:600px){.hero h1{font-size:44px}.wrap{padding-top:34px}}
</style></head><body><div class="wrap"><header class="hero"><div class="eyebrow">THE BEGINNING OF FOREVER</div><h1>Our Wedding Planner ♡</h1><p>把每個準備結婚的小日子，都好好收藏。</p><div class="datebox"><div class="small">距離我們的大日子</div><div><span class="days" id="days">♡</span> <span class="small" id="daylabel">天</span></div><label class="small">婚禮日期　<input id="weddingDate" type="date" aria-label="婚禮日期"></label></div></header><nav class="tabs" id="tabs"><button class="tab active" data-tab="home">🏡 總覽</button><button class="tab" data-tab="tasks">☑️ 待辦</button><button class="tab" data-tab="budget">💰 預算</button><button class="tab" data-tab="vendors">🌷 廠商</button><button class="tab" data-tab="guests">💌 賓客</button><button class="tab" data-tab="notes">📖 筆記</button></nav><main>
<section id="home" class="panel active"><div class="card"><h2>我們的備婚進度 ✨</h2><div class="stats"><div class="stat"><span class="small">任務完成</span><b id="taskStat">0 / 0</b></div><div class="stat"><span class="small">預算使用</span><b id="budgetStat">0%</b></div></div><p class="small">待辦完成率</p><div class="progress"><span id="taskProgress" style="width:0%"></span></div></div><div class="card"><h2>婚禮小檔案</h2><div class="form"><label>我們的名字<input id="couple" placeholder="例如：小明 ♡ 小美"></label><label>婚禮地點<input id="venue" placeholder="例如：新竹某某婚宴會館"></label><label>總預算（NT$）<input id="totalBudget" type="number" min="0" inputmode="numeric" placeholder="例如：500000"></label></div></div><div class="card"><h2>下一步要做什麼？</h2><div id="upcoming"></div></div><div class="card"><h2>資料備份與轉移</h2><p class="hint">資料會自動保存在目前這台裝置的瀏覽器。換手機、使用無痕模式或清除網站資料可能會遺失，建議定期匯出備份。</p><div class="backup"><button class="btn secondary" id="export">⬇ 匯出備份</button><button class="btn secondary" id="importBtn">⬆ 匯入備份</button><input type="file" id="importFile" accept=".json,application/json" hidden></div></div></section>
<section id="tasks" class="panel"><div class="card"><h2>備婚待辦清單</h2><div class="formgrid"><select id="taskFilter" aria-label="篩選任務"><option value="all">全部任務</option><option value="open">尚未完成</option><option value="done">已完成</option></select><button class="btn" id="addTask">＋ 新增任務</button></div><div id="taskList"></div></div></section>
<section id="budget" class="panel"><div class="card"><h2>婚禮預算管理</h2><div class="stats"><div class="stat"><span class="small">預算總額</span><b id="bTotal">$0</b></div><div class="stat"><span class="small">實際支出</span><b id="bSpent">$0</b></div></div><p class="small" id="bRemain"></p><div class="progress"><span id="bProgress"></span></div><div class="toolbar"><h2 style="margin:0">支出明細</h2><button class="btn" id="addExpense">＋ 新增</button></div><div id="expenseList"></div></div></section>
<section id="vendors" class="panel"><div class="card"><div class="toolbar"><h2>婚禮廠商紀錄</h2><button class="btn" id="addVendor">＋ 新增</button></div><div id="vendorList"></div></div></section>
<section id="guests" class="panel"><div class="card"><div class="toolbar"><h2>賓客與出席確認</h2><button class="btn" id="addGuest">＋ 新增</button></div><p class="hint" id="guestSummary"></p><div id="guestList"></div></div></section>
<section id="notes" class="panel"><div class="card"><div class="toolbar"><h2>備婚日記與靈感</h2><button class="btn" id="addNote">＋ 新增</button></div><div id="noteList"></div></div></section></main><div class="footer">Made with love ♡ 每一步，都離幸福更近一點</div></div>
<dialog id="dialog" style="border:0;border-radius:20px;padding:22px;width:calc(100% - 30px);max-width:480px;background:var(--paper);color:var(--ink)"><h2 id="dialogTitle" style="margin-top:0"></h2><form id="editForm" class="form"></form><div class="toolbar"><button class="btn secondary" id="cancel" type="button">取消</button><button class="btn" id="save" type="button">儲存 ♡</button></div></dialog>
<script>
const KEY='our-wedding-planner-v1';const defaults=()=>({weddingDate:'',couple:'',venue:'',totalBudget:500000,tasks:['決定婚禮日期','討論婚禮形式與預算','雙方家長見面','挑選婚宴場地','確認婚宴桌數','預訂婚禮攝影','挑選婚紗與禮服','安排新秘與造型','製作喜帖與婚禮網站','確認賓客名單','討論婚禮流程','安排婚禮小物','確認座位表','婚禮前最終確認'].map((name,i)=>({id:uid(),name,category:i<3?'初期規劃':i<8?'廠商預訂':'婚禮籌備',due:'',done:false})),expenses:[],vendors:[],guests:[],notes:[]});function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}let state;try{state=JSON.parse(localStorage.getItem(KEY))||defaults()}catch(e){state=defaults()}function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('儲存失敗，請先匯出備份，並確認瀏覽器儲存空間。')}}const $=id=>document.getElementById(id),money=n=>'$'+Number(n||0).toLocaleString('zh-TW'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function itemTitle(s){return esc(s||'未命名')};function render(){['weddingDate','couple','venue','totalBudget'].forEach(k=>{if(document.activeElement!==$(k))$(k).value=state[k]??''});let delta=state.weddingDate?Math.ceil((new Date(state.weddingDate+'T00:00:00')-new Date(new Date().toDateString()))/86400000):null;$('days').textContent=delta===null?'♡':Math.abs(delta);$('daylabel').textContent=delta===null?'設定婚禮日期':delta<0?'天前，我們結婚了 ♡':'天';let done=state.tasks.filter(x=>x.done).length,spent=state.expenses.reduce((a,x)=>a+Number(x.amount||0),0),total=Number(state.totalBudget||0),pct=total?spent/total*100:0;$('taskStat').textContent=done+' / '+state.tasks.length;$('budgetStat').textContent=Math.round(pct)+'%';$('taskProgress').style.width=(state.tasks.length?done/state.tasks.length*100:0)+'%';$('bTotal').textContent=money(total);$('bSpent').textContent=money(spent);$('bRemain').textContent='剩餘預算：'+money(total-spent);$('bProgress').style.width=Math.min(100,pct)+'%';$('upcoming').innerHTML=state.tasks.filter(x=>!x.done).slice(0,4).map(x=>'<div class="item">🌸 <div class="main">'+itemTitle(x.name)+'</div><span class="pill">'+esc(x.category)+'</span></div>').join('')||'<div class="empty">任務都完成啦！🎉</div>';let f=$('taskFilter').value;let ts=state.tasks.filter(x=>f==='all'||(f==='done'?x.done:!x.done));$('taskList').innerHTML=ts.map(x=>'<div class="item"><input type="checkbox" aria-label="完成任務" data-check="'+x.id+'" '+(x.done?'checked':'')+'><div class="main '+(x.done?'done':'')+'">'+itemTitle(x.name)+'<div class="small">'+esc(x.category||'其他')+(x.due?' · '+esc(x.due):'')+'</div></div><button class="iconbtn" data-edit="tasks:'+x.id+'" aria-label="編輯">✎</button></div>').join('')||'<div class="empty">這裡還沒有任務</div>';$('expenseList').innerHTML=state.expenses.map(x=>'<div class="item"><div class="main">'+itemTitle(x.name)+'<div class="small">'+esc(x.category||'其他')+(x.date?' · '+esc(x.date):'')+'</div></div><div class="money">'+money(x.amount)+'</div><button class="iconbtn" data-edit="expenses:'+x.id+'">✎</button></div>').join('')||'<div class="empty">尚未新增支出</div>';$('vendorList').innerHTML=state.vendors.map(x=>'<div class="item"><div class="main"><b>'+itemTitle(x.name)+'</b><div class="small">'+esc(x.category||'其他')+' · '+esc(x.status||'洽詢中')+'</div><div class="small">'+esc(x.contact||'')+'</div></div><button class="iconbtn" data-edit="vendors:'+x.id+'">✎</button></div>').join('')||'<div class="empty">把喜歡的廠商記錄在這裡 🌷</div>';$('guestSummary').textContent='名單 '+state.guests.length+' 筆 · 預計 '+state.guests.reduce((a,x)=>a+Number(x.count||1),0)+' 人 · 已確認 '+state.guests.filter(x=>x.status==='出席').reduce((a,x)=>a+Number(x.count||1),0)+' 人';$('guestList').innerHTML=state.guests.map(x=>'<div class="item"><div class="main"><b>'+itemTitle(x.name)+'</b><div class="small">'+esc(x.side||'共同')+' · '+esc(x.status||'待確認')+' · '+Number(x.count||1)+' 人</div></div><button class="iconbtn" data-edit="guests:'+x.id+'">✎</button></div>').join('')||'<div class="empty">賓客名單從這裡開始 💌</div>';$('noteList').innerHTML=state.notes.map(x=>'<div class="item"><div class="main"><b>'+itemTitle(x.title)+'</b><div class="small note">'+esc(x.content||'')+'</div></div><button class="iconbtn" data-edit="notes:'+x.id+'">✎</button></div>').join('')||'<div class="empty">記下屬於你們的靈感與回憶 📖</div>'}
const fields={tasks:[['name','任務名稱','text'],['category','分類','text'],['due','預計完成日期','date']],expenses:[['name','支出項目','text'],['category','分類','text'],['amount','金額','number'],['date','付款日期','date']],vendors:[['name','廠商名稱','text'],['category','服務類別','text'],['contact','聯絡方式／網址','text'],['status','洽談狀態','select','洽詢中|已預訂|已完成|不考慮'],['memo','備註','textarea']],guests:[['name','賓客姓名','text'],['side','所屬','select','男方|女方|共同'],['count','人數','number'],['status','出席狀態','select','待確認|出席|不出席'],['memo','備註／飲食需求','textarea']],notes:[['title','標題','text'],['content','內容','textarea']]};let editing=null;function edit(type,id){let old=id?state[type].find(x=>x.id===id):null;editing={type,id};$('dialogTitle').textContent=(id?'編輯':'新增')+({tasks:'任務',expenses:'支出',vendors:'廠商',guests:'賓客',notes:'筆記'}[type]);$('editForm').innerHTML=fields[type].map(([key,label,kind,opts])=>'<label>'+label+(kind==='textarea'?'<textarea name="'+key+'">'+esc(old?.[key]??'')+'</textarea>':kind==='select'?'<select name="'+key+'">'+opts.split('|').map(o=>'<option '+((old?.[key]??'')===o?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select>':'<input name="'+key+'" type="'+kind+'" '+(kind==='number'?'min="0" inputmode="numeric"':'')+' value="'+esc(old?.[key]??(key==='count'?1:''))+'">')+'</label>').join('')+(id?'<button class="btn danger" type="button" id="deleteRecord">刪除此筆紀錄</button>':'');$('dialog').showModal();if(id)$('deleteRecord').onclick=()=>{if(confirm('確定要刪除這筆紀錄嗎？')){state[type]=state[type].filter(x=>x.id!==id);persist();render();$('dialog').close()}}}['tasks','expenses','vendors','guests','notes'].forEach((t,i)=>$( ['addTask','addExpense','addVendor','addGuest','addNote'][i]).onclick=()=>edit(t));$('save').onclick=()=>{let {type,id}=editing;let data=Object.fromEntries(new FormData($('editForm')).entries());if(!String(data.name??data.title??'').trim()){alert('請填寫名稱或標題');return}if(type==='expenses')data.amount=Number(data.amount||0);if(type==='guests')data.count=Math.max(1,Number(data.count||1));if(id){let x=state[type].find(x=>x.id===id);Object.assign(x,data)}else state[type].push({id:uid(),...(type==='tasks'?{done:false}:{}),...data});persist();render();$('dialog').close()};$('cancel').onclick=()=>$('dialog').close();document.addEventListener('click',e=>{let el=e.target.closest('[data-edit]');if(el){let [t,id]=el.dataset.edit.split(':');edit(t,id)}});document.addEventListener('change',e=>{if(e.target.dataset.check){let t=state.tasks.find(x=>x.id===e.target.dataset.check);if(t)t.done=e.target.checked;persist();render()}});['weddingDate','couple','venue','totalBudget'].forEach(k=>$(k).addEventListener('input',e=>{state[k]=k==='totalBudget'?Number(e.target.value||0):e.target.value;persist();render()}));$('taskFilter').onchange=render;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(el=>el.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active');window.scrollTo({top:200,behavior:'smooth'})});$('export').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='備婚紀錄備份-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let x=JSON.parse(await file.text());if(!Array.isArray(x.tasks)||!Array.isArray(x.expenses)||!Array.isArray(x.vendors)||!Array.isArray(x.guests)||!Array.isArray(x.notes))throw Error();if(confirm('匯入將取代目前的備婚資料，確定嗎？')){state=x;persist();render();alert('匯入成功 ♡')}}catch(err){alert('檔案格式不正確')}e.target.value=''};render();
</script></body></html>
